name: CI
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # 11 release gates: typecheck, lint, tests, locale parity, raw keys, naming,
      # offline/permissions, billing-bypass guard, route inventory, legal docs, Figma audit.
      - run: npm run verify
